<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bidir-level-shifter layout viewer</title>
<style>
  /* EDA-tool look: dark dock panel, monospace, title-bar sections, stippled layer swatches */
  :root {
    --dock: #1d2126; --dock-2: #252a31; --title: #2f353e; --text: #d7dce3; --muted: #8b95a3;
    --line: #3a414b; --edge: #0f1215; --accent: #f0b429; --sel: #34404f; --canvas: #0b0d10;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: 1fr 290px; grid-template-rows: 100%;
    background: var(--edge); color: var(--text);
    font: 12px/1.35 var(--mono);
  }
  body.collapsed { grid-template-columns: 1fr 30px; }
  body.collapsed aside > :not(.head) { display: none; }
  body.collapsed .head { flex-direction: column; height: 100%; padding: 4px 0; }
  body.collapsed .head h1 {
    writing-mode: vertical-rl; transform: rotate(180deg); margin-top: 8px; color: var(--muted);
  }
  body.collapsed .head h1 .tag { display: none; }
  aside {
    grid-column: 2; grid-row: 1; min-width: 0;
    background: var(--dock); border-left: 1px solid var(--edge);
    box-shadow: inset 1px 0 0 var(--line);
    overflow-y: auto; display: flex; flex-direction: column;
  }
  .head {
    display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px;
    background: linear-gradient(#353c46, #2b3139); border-bottom: 1px solid var(--edge);
    position: sticky; top: 0; z-index: 1;
  }
  h1 { font-size: 12px; margin: 0; font-weight: 600; letter-spacing: .02em; flex: 1; white-space: nowrap; }
  h1 .tag { color: var(--accent); }
  #panel-toggle { width: 20px; height: 20px; padding: 0; line-height: 18px; text-align: center; flex: none; }
  .dock { border-bottom: 1px solid var(--edge); }
  .dock > h2 {
    display: flex; align-items: center; gap: 6px; margin: 0; padding: 3px 10px;
    background: var(--title); border-bottom: 1px solid var(--edge); box-shadow: inset 0 1px 0 #3c434d;
    font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #b9c2ce;
  }
  .dock > h2::before { content: "▾"; color: var(--muted); }
  .dock > h2 .meta { margin-left: auto; color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 400; }
  .body { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  p { margin: 0; color: var(--muted); font-size: 11px; }
  code, kbd { font: inherit; color: #c9d3df; background: var(--dock-2); padding: 0 3px; border: 1px solid var(--line); }
  a { color: var(--accent); }
  select, button {
    font: inherit; color: var(--text); background: linear-gradient(#323943, #2a3038);
    border: 1px solid var(--edge); box-shadow: inset 0 1px 0 #414955; border-radius: 2px; padding: 3px 8px;
  }
  select { width: 100%; background: var(--dock-2); box-shadow: none; border-color: var(--line); }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button:active { background: #23282f; box-shadow: inset 0 1px 2px #000; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  .toolbar { display: flex; gap: 0; }
  .toolbar button { flex: 1; border-radius: 0; }
  .toolbar button + button { border-left: 0; }
  .toolbar button:first-child { border-radius: 2px 0 0 2px; }
  .toolbar button:last-child { border-radius: 0 2px 2px 0; }
  .readout { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-variant-numeric: tabular-nums; }
  .readout dt { color: var(--muted); }
  .readout dd { margin: 0; text-align: right; }
  #layers, #labels { list-style: none; margin: 0; padding: 2px 0; }
  #layers label, #labels label {
    display: grid; grid-template-columns: 14px 22px 1fr auto auto; align-items: center; gap: 6px;
    padding: 1px 10px; cursor: pointer; white-space: nowrap;
  }
  #labels label { grid-template-columns: 14px 1fr; }
  #layers li:nth-child(even) label { background: rgba(255, 255, 255, .025); }
  #layers label:hover, #labels label:hover { background: var(--sel); }
  input[type=checkbox] { margin: 0; width: 12px; height: 12px; accent-color: var(--accent); }
  .swatch { width: 22px; height: 12px; border: 1px solid; flex: none; }
  .gds { color: var(--muted); font-size: 10.5px; text-align: right; min-width: 44px; }
  .count { color: #6f7a88; font-size: 10.5px; text-align: right; min-width: 40px; font-variant-numeric: tabular-nums; }
  #layers li.off label { color: #66707d; }
  .foot { margin-top: auto; padding: 6px 10px; border-top: 1px solid var(--line); }
  main { grid-column: 1; grid-row: 1; position: relative; min-width: 0; min-height: 0; background: var(--canvas); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  canvas.dragging { cursor: grabbing; }
  #status {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 10px;
    background: rgba(29, 33, 38, .92); border-top: 1px solid var(--line); color: var(--text);
    font: 11px var(--mono); font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #status:empty { display: none; }
  #message {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); pointer-events: none; text-align: center; padding: 16px;
  }
  @media (max-width: 720px) {
    body, body.collapsed { grid-template-columns: 1fr; grid-template-rows: minmax(55vh, 1fr) auto; height: auto; min-height: 100%; }
    main { grid-column: 1; grid-row: 1; }
    aside { grid-column: 1; grid-row: 2; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
    body.collapsed .head { flex-direction: row; height: auto; }
    body.collapsed .head h1 { writing-mode: horizontal-tb; transform: none; margin: 0; }
  }
</style>
</head>
<body>
<aside id="panel">
  <div class="head">
    <h1><span class="tag">▣</span> bidir-level-shifter</h1>
    <button id="panel-toggle" type="button" aria-controls="panel" aria-expanded="true"
            aria-label="Hide panel" title="Hide panel">›</button>
  </div>
  <section class="dock">
    <h2>Cell</h2>
    <div class="body">
      <select id="cell" aria-label="Cell"></select>
      <dl class="readout" style="margin:0">
        <dt>bbox</dt><dd id="info">–</dd>
        <dt>shapes</dt><dd id="nshapes">–</dd>
        <dt>pdk</dt><dd>IHP SG13CMOS5L</dd>
      </dl>
      <div class="toolbar">
        <button id="fit" type="button" title="Zoom to fit">Fit</button>
        <button id="all" type="button" title="Show all layers">All</button>
        <button id="none" type="button" title="Hide all layers">None</button>
      </div>
    </div>
  </section>
  <section class="dock">
    <h2>Layers <span class="meta">gds &nbsp; shapes</span></h2>
    <ul id="layers"></ul>
  </section>
  <section class="dock">
    <h2>Labels</h2>
    <ul id="labels">
      <li><label><input type="checkbox" id="nets" checked> Net names</label></li>
      <li><label><input type="checkbox" id="insts"> Instance names</label></li>
    </ul>
  </section>
  <div class="foot">
    <p>Drag to pan, scroll or pinch to zoom. <code>#slot_1@x1,y1,x2,y2</code> opens a cell
       zoomed to a box in µm. Data from <code>layout/*.gds</code> via
       <code>docs/viewer/make_data.py</code>.</p>
  </div>
</aside>
<main>
  <canvas id="view" aria-label="Layout"></canvas>
  <div id="message">Loading…</div>
  <div id="status"></div>
</main>
<script>
"use strict";
const canvas = document.getElementById("view"), ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);
let layerDefs = [], visible = {}, cell = null, paths = {};
let scale = 1, ox = 0, oy = 0;            // screen = (world_um * scale + ox, -world_um * scale + oy)

// layer-palette style swatch: a hatch pattern per layer, like a layout tool's stipples
function stipple(l, i) {
  const c = rgba(l.color, 0.9), bg = rgba(l.color, Math.min(Math.max(l.alpha, 0.12), 0.3));
  const pats = [
    `repeating-linear-gradient(45deg, ${c} 0 1px, transparent 1px 4px)`,
    `repeating-linear-gradient(-45deg, ${c} 0 1px, transparent 1px 4px)`,
    `repeating-linear-gradient(45deg, ${c} 0 1px, transparent 1px 4px), repeating-linear-gradient(-45deg, ${c} 0 1px, transparent 1px 4px)`,
    `radial-gradient(${c} 0.8px, transparent 1px) 0 0 / 3px 3px`,
    `repeating-linear-gradient(0deg, ${c} 0 1px, transparent 1px 3px)`,
    `repeating-linear-gradient(90deg, ${c} 0 1px, transparent 1px 3px)`,
  ];
  if (l.alpha >= 0.8) return c;               // cuts: solid
  return `${pats[i % pats.length]}, ${bg}`;
}

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function resize() {
  const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(r.width * d));
  canvas.height = Math.max(1, Math.round(r.height * d));
  draw();
}

let zoomBox = null;                       // [x1, y1, x2, y2] in um from the URL, used once
function parseHash() {
  const [name, box] = decodeURIComponent(location.hash.slice(1)).split("@");
  const nums = (box || "").split(",").map(Number);
  return { name, box: nums.length === 4 && nums.every(isFinite) ? nums : null };
}

function fit() {
  if (!cell) return;
  const r = canvas.getBoundingClientRect();
  const [x1, y1, x2, y2] = zoomBox || cell.bbox.map(v => v / 1000);
  zoomBox = null;
  const w = Math.max(x2 - x1, 1e-3), h = Math.max(y2 - y1, 1e-3);
  scale = 0.92 * Math.min(r.width / w, r.height / h);
  ox = r.width / 2 - (x1 + x2) / 2 * scale;
  oy = r.height / 2 + (y1 + y2) / 2 * scale;
  draw();
}

function buildPaths() {
  paths = {};
  for (const [id, shapes] of Object.entries(cell.layers)) {
    const p = new Path2D();
    for (const s of shapes) {
      if (s.length === 4) {
        p.rect(s[0] / 1000, s[1] / 1000, (s[2] - s[0]) / 1000, (s[3] - s[1]) / 1000);
      } else {
        p.moveTo(s[0] / 1000, s[1] / 1000);
        for (let i = 2; i < s.length; i += 2) p.lineTo(s[i] / 1000, s[i + 1] / 1000);
        p.closePath();
      }
    }
    paths[id] = p;
  }
}

function niceStep(um) {
  const p = Math.pow(10, Math.floor(Math.log10(um)));
  return [1, 2, 5, 10].map(m => m * p).find(v => v >= um);
}

function draw() {
  const d = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!cell) return;
  ctx.setTransform(scale * d, 0, 0, -scale * d, ox * d, oy * d);
  ctx.lineWidth = 1 / scale;
  for (const l of layerDefs) {
    if (!visible[l.id] || !paths[l.id]) continue;
    ctx.fillStyle = rgba(l.color, l.alpha);
    ctx.strokeStyle = rgba(l.color, 0.9);
    ctx.fill(paths[l.id]);
    ctx.stroke(paths[l.id]);
  }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  const w = canvas.width / d, h = canvas.height / d;
  // labels, only where they are on screen
  const show = { net: $("nets").checked, inst: $("insts").checked };
  ctx.font = "12px system-ui, sans-serif";
  ctx.textBaseline = "middle";
  for (const [text, x, y, kind] of cell.labels) {
    if (!show[kind]) continue;
    const sx = x / 1000 * scale + ox, sy = -y / 1000 * scale + oy;
    if (sx < -50 || sy < -10 || sx > w + 10 || sy > h + 10) continue;
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = "rgba(0,0,0,.65)";
    ctx.fillRect(sx + 3, sy - 8, tw + 6, 16);
    ctx.fillStyle = kind === "net" ? "#ffe27a" : "#ffffff";
    ctx.fillText(text, sx + 6, sy);
    ctx.fillRect(sx - 1.5, sy - 1.5, 3, 3);
  }
  // scale bar
  const step = niceStep(90 / scale), len = step * scale;
  ctx.fillStyle = "#e6e9ee";
  ctx.fillRect(w - len - 14, h - 32, len, 2);
  ctx.textAlign = "right";
  ctx.fillText(step >= 1 ? `${step} µm` : `${Math.round(step * 1000)} nm`, w - 14, h - 42);
  ctx.textAlign = "left";
}

async function loadCell(name) {
  $("message").textContent = "Loading…";
  try {
    const r = await fetch(`data/${name}.json`);
    if (!r.ok) throw new Error(r.status);
    cell = await r.json();
  } catch (e) {
    cell = null;
    $("message").textContent = `Could not load ${name}.`;
    draw();
    return;
  }
  $("message").textContent = "";
  buildPaths();
  for (const li of document.querySelectorAll("#layers li")) {
    const n = (cell.layers[li.dataset.id] || []).length;
    li.querySelector(".count").textContent = n || "";
    li.style.opacity = n ? 1 : 0.4;
  }
  const [x1, y1, x2, y2] = cell.bbox;
  $("info").textContent = `${((x2 - x1) / 1000).toFixed(2)} × ${((y2 - y1) / 1000).toFixed(2)} µm`;
  $("nshapes").textContent = Object.values(cell.layers).reduce((n, v) => n + v.length, 0).toLocaleString("en-US");
  if (!zoomBox) try { history.replaceState(null, "", "#" + name); } catch (e) {}
  fit();
}

async function start() {
  let index;
  try {
    index = await (await fetch("data/index.json")).json();
  } catch (e) {
    $("message").textContent = "Could not load data/index.json. Serve this folder over http.";
    return;
  }
  layerDefs = index.layers;
  const list = $("layers");
  for (const l of layerDefs) {
    visible[l.id] = true;
    const li = document.createElement("li");
    li.dataset.id = l.id;
    const label = document.createElement("label"), box = document.createElement("input");
    box.type = "checkbox"; box.checked = true;
    box.addEventListener("change", () => { visible[l.id] = box.checked; draw(); });
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = stipple(l, layerDefs.indexOf(l));
    sw.style.borderColor = l.color;
    const name = document.createElement("span"); name.textContent = l.name;
    const gds = document.createElement("span"); gds.className = "gds"; gds.textContent = l.id;
    const count = document.createElement("span"); count.className = "count";
    box.addEventListener("change", () => li.classList.toggle("off", !box.checked));
    label.append(box, sw, name, gds, count); li.append(label); list.append(li);
  }
  const select = $("cell");
  for (const c of index.cells) {
    const o = document.createElement("option");
    o.value = c.name; o.textContent = `${c.name}  (${c.width} × ${c.height} µm)`;
    select.append(o);
  }
  select.addEventListener("change", () => loadCell(select.value));
  const wanted = parseHash();
  if (index.cells.some(c => c.name === wanted.name)) {
    select.value = wanted.name;
    zoomBox = wanted.box;
  }
  resize();
  loadCell(select.value);
}

function setAll(on) {
  for (const box of document.querySelectorAll("#layers input")) box.checked = on;
  for (const li of document.querySelectorAll("#layers li")) li.classList.toggle("off", !on);
  for (const l of layerDefs) visible[l.id] = on;
  draw();
}
$("fit").addEventListener("click", fit);
function setToggle(open) {
  const t = $("panel-toggle"), label = open ? "Hide panel" : "Show panel";
  t.textContent = open ? "›" : "‹";
  t.setAttribute("aria-expanded", open);
  t.setAttribute("aria-label", label);
  t.title = label;
}
function setPanel(open) {
  document.body.classList.toggle("collapsed", !open);
  setToggle(open);
  try { localStorage.setItem("viewer-panel", open ? "open" : "closed"); } catch (e) {}
  resize();
}
$("panel-toggle").addEventListener("click", () => setPanel(document.body.classList.contains("collapsed")));
try { if (localStorage.getItem("viewer-panel") === "closed") document.body.classList.add("collapsed"); } catch (e) {}
if (document.body.classList.contains("collapsed")) setToggle(false);
$("all").addEventListener("click", () => setAll(true));
$("none").addEventListener("click", () => setAll(false));
$("nets").addEventListener("change", draw);
$("insts").addEventListener("change", draw);
window.addEventListener("resize", resize);

// pan and zoom: mouse, touch and pen through pointer events
const pointers = new Map();
let pinch = 0;
function zoomAt(x, y, factor) {
  const s = Math.min(Math.max(scale * factor, 0.5), 5000);
  ox = x - (x - ox) * (s / scale);
  oy = y - (y - oy) * (s / scale);
  scale = s;
  draw();
}
function local(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, local(e));
  canvas.classList.add("dragging");
  pinch = 0;
});
canvas.addEventListener("pointermove", e => {
  const [x, y] = local(e);
  if (cell) {
    $("status").textContent =
      `x ${((x - ox) / scale).toFixed(3)}  y ${((oy - y) / scale).toFixed(3)} µm`;
  }
  if (!pointers.has(e.pointerId)) return;
  const [px, py] = pointers.get(e.pointerId);
  pointers.set(e.pointerId, [x, y]);
  if (pointers.size === 1) {
    ox += x - px; oy += y - py;
    draw();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, dist / pinch);
    pinch = dist;
  }
});
function release(e) {
  pointers.delete(e.pointerId);
  pinch = 0;
  if (!pointers.size) canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const [x, y] = local(e);
  zoomAt(x, y, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
}, { passive: false });

start();
</script>
</body>
</html>
